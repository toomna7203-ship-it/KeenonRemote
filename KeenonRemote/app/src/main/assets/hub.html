<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keenon Hub</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --blue:#2b7de9; --green:#22a559; --red:#d64545; --line:#dfe3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eceff4; --muted:#9aa3b2; --line:#333a45; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px 0; }
  h1 { font-size:20px; margin:0 0 12px; }
  .robots { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; border:2px solid var(--line);
          background:var(--card); color:var(--text); font-size:16px; cursor:pointer; }
  .chip.sel { border-color:var(--blue); background:var(--blue); color:#fff; }
  .dot { width:10px; height:10px; border-radius:50%; background:#999; }
  .dot.on { background:var(--green); } .dot.off { background:var(--red); } .dot.warn { background:#e0a100; }
  .tools { display:none; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0 4px; }
  .tools.open { display:flex; }
  .gear { font-size:14px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .top h1 { margin:0; }
  .tools .lbl { color:var(--muted); font-size:14px; }
  .tools .sep { width:12px; }
  input { font-size:16px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button.small { font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  main { padding:20px 24px 40px; }
  .panel { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--line); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .bar .title { font-size:18px; font-weight:600; margin-right:auto; }
  .grid { display:flex; flex-wrap:wrap; gap:12px; }
  .pt { min-width:120px; height:84px; font-size:28px; border:0; border-radius:14px; background:var(--blue); color:#fff; cursor:pointer; padding:0 18px; }
  .pt:disabled { opacity:.45; cursor:wait; }
  .pt.on { background:#174fa8; outline:3px solid var(--text); }
  .badge { display:inline-block; width:30px; height:30px; line-height:30px; border-radius:50%; background:#fff; color:#174fa8; font-size:17px; font-weight:700; margin-right:10px; vertical-align:middle; }
  .actions { display:flex; gap:10px; margin-top:18px; align-items:center; }
  .actions .hint { color:var(--muted); font-size:14px; }
  button.start { font-size:18px; padding:12px 22px; border-radius:10px; border:0; background:var(--green); color:#fff; cursor:pointer; }
  button.start:disabled { opacity:.45; cursor:default; }
  #alerts { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .alert { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:16px 20px; border-radius:14px; border:2px solid #e0a100; background:var(--card); }
  .alert .txt { font-size:20px; font-weight:600; margin-right:auto; }
  .alert button { font-size:24px; padding:12px 40px; border-radius:12px; border:0; background:var(--green); color:#fff; cursor:pointer; }
  .chip.group { border-style:dashed; }
  .rlist { margin-top:20px; display:flex; flex-direction:column; gap:8px; }
  .rrow { display:flex; gap:10px; align-items:center; font-size:16px; }
  .tag { padding:2px 12px; border-radius:999px; font-size:13px; background:var(--line); color:var(--text); }
  .tag.free { background:var(--green); color:#fff; } .tag.wait { background:#e0a100; color:#fff; }
  .seen { font-size:12px; color:var(--muted); margin-left:6px; }
  .gmsg { margin-top:16px; min-height:24px; color:var(--muted); font-size:16px; }
  #msg { margin-top:18px; min-height:24px; color:var(--muted); font-size:16px; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="top"><h1>สั่ง AMR Keenon</h1><button class="gear" id="gear">⚙ ตั้งค่า / เพิ่มหุ่น</button></div>
  <div class="robots" id="robots"></div>
  <div class="tools">
    <input id="newip" placeholder="IP หุ่น เช่น 192.168.50.137" size="22">
    <button class="small" id="addrobot">+ เพิ่มหุ่นเอง</button>
    <span class="sep"></span>
    <span class="lbl">ค้นหาในวง</span>
    <input id="subnet" size="12" title="3 ชุดแรกของ IP เช่น 192.168.50">
    <span class="lbl">พอร์ต</span>
    <input id="port" size="5">
    <button class="small" id="find">🔍 ค้นหาหุ่นอัตโนมัติ</button>
    <span id="findmsg" class="lbl"></span>
  </div>
</header>
<main>
  <div id="alerts"></div>
  <div class="panel" id="rpanel">
    <div class="bar">
      <span class="title" id="title">-</span>
      <button class="small" id="scan">สแกนจุดจากหุ่น</button>
      <button class="small" id="addpt">+ เพิ่มจุดเอง</button>
      <button class="small" id="retbtn">↩ กลับจุดพัก</button>
      <button class="small" id="rename">✎ ตั้งชื่อ</button>
      <button class="small" id="delrobot">ลบหุ่นคันนี้</button>
    </div>
    <div class="grid" id="points"></div>
    <div class="actions" id="actions"></div>
    <div id="msg"></div>
  </div>
  <div class="panel" id="gpanel" style="display:none">
    <div class="bar"><span class="title" id="gtitle">👥 เรียกหุ่นที่ว่าง</span></div>
    <div class="grid" id="gpoints"></div>
    <div class="actions" id="gactions"></div>
    <div class="rlist" id="glist"></div>
    <div class="gmsg" id="gmsg"></div>
  </div>
</main>

<script>
var LS = 'keenon_hub_v1';
var state = { robots: [], sel: 0 };
try { var s = JSON.parse(localStorage.getItem(LS)); if (s && s.robots) state = s; } catch (e) {}
var robotStatus = {};
if (!state.subnet) state.subnet = '';
if (!state.port) state.port = 8080;          // ip -> 'on' | 'off' | 'warn'
var busy = false;
var groupMode = state.groupMode || (state.groupView ? 'diner' : null);   // กลุ่มที่กำลังเปิดดู: 'diner' (T9) / 'industry' (S100)
var busySeen = {};       // ip -> เวลาที่เห็นหุ่นออกจากหน้าว่างหลังรับงาน
var robotState = {};     // ip -> {state, idle} จาก /status (หุ่น T9)
var lastDispatch = {};   // ip -> เวลาที่สั่งงานล่าสุด
var lastReady = {};      // ip -> เวลาที่เห็นหุ่นอยู่หน้าเลือกจุดและว่างล่าสุด
var queue = null;        // งานที่รอหุ่นว่าง
var picks = {};          // ip -> จุดที่เลือกไว้ตามลำดับ (หุ่น T9)
var served = location.protocol.indexOf('http') === 0;
if (served && location.port) { state.port = parseInt(location.port, 10); }

function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function base(ip) { return 'http://' + (ip.indexOf(':') < 0 ? ip + ':' + (state.port || 8080) : ip); }
function nm(r) { return r.name ? r.name + ' (' + r.ip + ')' : r.ip; }
function nmIp(ip) { var f = state.robots.filter(function (r) { return r.ip === ip; })[0]; return f ? nm(f) : ip; }
function setMsg(t) { document.getElementById('msg').textContent = t; }

function api(ip, path, ms) {
  var c = new AbortController();
  var t = setTimeout(function () { c.abort(); }, ms || 8000);
  return fetch(base(ip) + path, { signal: c.signal })
    .then(function (r) { clearTimeout(t); return r.json(); })
    .catch(function (e) { clearTimeout(t); throw e; });
}

function render() {
  var gv = !!groupMode && groupRobots().length >= 2;
  var box = document.getElementById('robots');
  box.innerHTML = '';
  state.robots.forEach(function (r, i) {
    var b = document.createElement('button');
    b.className = 'chip' + (!gv && i === state.sel ? ' sel' : '');
    var d = document.createElement('span');
    d.className = 'dot ' + (robotStatus[r.ip] || '');
    b.appendChild(d);
    b.appendChild(document.createTextNode(r.name ? r.name + ' · ' + r.ip : r.ip));
    b.onclick = function () { state.sel = i; groupMode = null; state.groupMode = null; save(); render(); };
    box.appendChild(b);
  });
  ['diner', 'industry'].forEach(function (m) {
    var n = groupRobots(m).length;
    if (n < 2) return;
    var gb = document.createElement('button');
    gb.className = 'chip group' + (gv && groupMode === m ? ' sel' : '');
    gb.textContent = '👥 เรียกหุ่นที่ว่าง ' + (m === 'diner' ? 'T9' : 'S100') + ' (' + n + ' คัน)';
    gb.onclick = function () { groupMode = m; state.groupMode = m; save(); render(); };
    box.appendChild(gb);
  });
  document.getElementById('rpanel').style.display = gv ? 'none' : '';
  document.getElementById('gpanel').style.display = gv ? '' : 'none';
  if (gv) { renderGroup(); return; }
  var cur = state.robots[state.sel];
  document.getElementById('title').textContent = cur ? 'หุ่น ' + nm(cur) + (cur.mode === 'diner' ? ' (T9)' : cur.mode === 'industry' ? ' (S100)' : '') + ' — เลือกจุดที่ต้องการให้ไป' : 'ยังไม่มีหุ่น เพิ่ม IP ด้านบนก่อน';
  document.getElementById('retbtn').style.display = (cur && cur.mode === 'diner') ? '' : 'none';
  document.getElementById('rename').style.display = cur ? '' : 'none';
  var g = document.getElementById('points'); g.innerHTML = '';
  if (!cur) return;
  if (!cur.points.length) { g.innerHTML = '<span class="empty">ยังไม่มีจุด กด "สแกนจุดจากหุ่น" หรือ "+ เพิ่มจุดเอง"</span>'; }
  var multi = (cur.max || 1) > 1;
  var sel = picks[cur.ip] = picks[cur.ip] || [];
  cur.points.forEach(function (p) {
    var b = document.createElement('button'); b.className = 'pt'; b.disabled = busy;
    var idx = sel.indexOf(p);
    if (multi && idx >= 0) {
      b.className += ' on';
      var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = idx + 1;
      b.appendChild(bd); b.appendChild(document.createTextNode(p));
    } else { b.textContent = p; }
    b.onclick = function () { if (multi) toggle(cur, p); else go([p]); };
    g.appendChild(b);
  });
  var act = document.getElementById('actions'); act.innerHTML = '';
  if (multi) {
    var st = document.createElement('button'); st.className = 'start';
    st.textContent = '▶ ส่งหุ่นไป ' + sel.length + ' จุด'; st.disabled = busy || !sel.length;
    st.onclick = function () { go(sel.slice()); };
    var cl = document.createElement('button'); cl.className = 'small'; cl.textContent = 'ล้างที่เลือก'; cl.disabled = busy || !sel.length;
    cl.onclick = function () { picks[cur.ip] = []; render(); };
    var hint = document.createElement('span'); hint.className = 'hint';
    hint.textContent = 'เลือกได้สูงสุด ' + cur.max + ' จุด หุ่นจะไปตามลำดับเลขที่เลือก';
    act.appendChild(st); act.appendChild(cl); act.appendChild(hint);
  }
}

function toggle(cur, p) {
  var sel = picks[cur.ip] = picks[cur.ip] || [];
  var i = sel.indexOf(p);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length < (cur.max || 1)) sel.push(p);
  else setMsg('เลือกได้สูงสุด ' + cur.max + ' จุด');
  render();
}

function addRobot() {
  var v = document.getElementById('newip').value.trim();
  if (!v) return;
  document.getElementById('newip').value = '';
  if (state.robots.some(function (r) { return r.ip === v; })) return;
  state.robots.push({ ip: v, points: [] }); state.sel = state.robots.length - 1;
  save(); render(); pingAll(); scan();
}

function go(list) {
  var r = state.robots[state.sel]; if (!r || busy) return;
  var txt = list.join(', ');
  busy = true; render(); setMsg('กำลังสั่ง ' + nm(r) + ' ไปจุด ' + txt + ' ...');
  api(r.ip, '/go?point=' + encodeURIComponent(list.join(',')), 60000)
    .then(function (j) { setMsg(nm(r) + ' → ' + txt + ' : ' + j.msg); if (/^sent/.test(j.msg)) picks[r.ip] = []; })
    .catch(function () { setMsg('ติดต่อ ' + r.ip + ' ไม่ได้ (เช็ก WiFi / IP)'); })
    .then(function () { busy = false; render(); });
}

function sendReturn(r) {
  if (!r || busy) return;
  if (!confirm('ส่ง ' + nm(r) + ' กลับจุดพัก (Return) ?')) return;
  busy = true; render(); setMsg('กำลังสั่ง ' + nm(r) + ' กลับจุดพัก ...');
  lastDispatch[r.ip] = Date.now();
  api(r.ip, '/return', 45000)
    .then(function (j) { setMsg(nm(r) + ' : ' + j.msg); })
    .catch(function () { setMsg('ติดต่อ ' + nm(r) + ' ไม่ได้'); })
    .then(function () { busy = false; render(); });
}

function scan() {
  var r = state.robots[state.sel]; if (!r || busy) return;
  busy = true; render(); setMsg('กำลังอ่านรายชื่อจุดจาก ' + r.ip + ' (แท็บเล็ตจะเปิดแอพ Industry เอง) ...');
  api(r.ip, '/points', 40000)
    .then(function (j) {
      if (j.ok) { r.points = j.points; save(); setMsg('พบ ' + j.points.length + ' จุด'); }
      else setMsg('สแกนไม่สำเร็จ: ' + j.msg);
    })
    .catch(function () { setMsg('ติดต่อ ' + r.ip + ' ไม่ได้'); })
    .then(function () { busy = false; render(); });
}

function pingAll() {
  state.robots.forEach(function (r) {
    api(r.ip, '/ping', 2500)
      .then(function (j) { robotStatus[r.ip] = j.acc ? 'on' : 'warn'; if (j.mode) r.mode = j.mode; r.max = j.max || 1; if (j.name) r.name = j.name; save(); })
      .catch(function () { robotStatus[r.ip] = 'off'; })
      .then(function () { if (!busy) render(); });
  });
}

document.getElementById('scan').onclick = scan;
document.getElementById('retbtn').onclick = function () { sendReturn(state.robots[state.sel]); };
document.getElementById('rename').onclick = function () {
  var r = state.robots[state.sel]; if (!r) return;
  var n = prompt('ตั้งชื่อหุ่นคันนี้ (IP ' + r.ip + ') เว้นว่างเพื่อลบชื่อ', r.name || '');
  if (n === null) return;
  r.name = n.trim().slice(0, 40); save(); render();
  api(r.ip, '/setname?name=' + encodeURIComponent(r.name), 5000).catch(function () {});
};
document.getElementById('addpt').onclick = function () {
  var r = state.robots[state.sel]; if (!r) return;
  var n = prompt('ชื่อจุด (ต้องตรงกับที่แสดงในแอพ Industry)'); if (!n) return;
  n = n.trim(); if (n && r.points.indexOf(n) < 0) { r.points.push(n); save(); render(); }
};
document.getElementById('delrobot').onclick = function () {
  var r = state.robots[state.sel]; if (!r) return;
  if (!confirm('ลบหุ่น ' + r.ip + ' ?')) return;
  state.robots.splice(state.sel, 1); state.sel = 0; save(); render();
};


// ---------- ค้นหาหุ่นอัตโนมัติ ----------
var finding = false;
function guessSubnet() {
  if (served && /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) return location.hostname.split('.').slice(0, 3).join('.');
  if (state.subnet) return state.subnet;
  if (state.robots.length) { var m = state.robots[0].ip.split(':')[0].split('.'); if (m.length === 4) return m.slice(0, 3).join('.'); }
  return '192.168.50';
}
function discover() {
  if (finding) return;
  var sub = document.getElementById('subnet').value.trim().replace(/\.$/, '');
  var port = parseInt(document.getElementById('port').value, 10) || 8080;
  if (!/^\d+\.\d+\.\d+$/.test(sub)) { document.getElementById('findmsg').textContent = 'ใส่ 3 ชุดแรกของ IP เช่น 192.168.50'; return; }
  state.subnet = sub; state.port = port; save();
  finding = true; var fm = document.getElementById('findmsg');
  var n = 1, done = 0, found = 0, total = 254;
  function worker() {
    if (n > total) return Promise.resolve();
    var host = sub + '.' + (n++);
    return api(host + ':' + port, '/ping', 1200)
      .then(function (j) {
        if (j && j.ok === true && 'acc' in j) {
          var key = host;
          if (!state.robots.some(function (r) { return r.ip === key; })) {
            state.robots.push({ ip: key, points: [] }); found++; save();
          }
          robotStatus[key] = j.acc ? 'on' : 'warn';
        }
      })
      .catch(function () {})
      .then(function () { done++; fm.textContent = 'กำลังค้นหา ' + done + '/' + total + ' พบใหม่ ' + found; return worker(); });
  }
  var pool = []; for (var i = 0; i < 40; i++) pool.push(worker());
  Promise.all(pool).then(function () {
    finding = false;
    fm.textContent = 'ค้นหาเสร็จ พบหุ่นใหม่ ' + found + ' คัน (รวม ' + state.robots.length + ' คัน)';
    if (state.sel >= state.robots.length) state.sel = 0;
    save(); render();
  });
}
document.getElementById('find').onclick = discover;
document.getElementById('gear').onclick = function () { document.querySelector('.tools').classList.toggle('open'); };
document.getElementById('port').onchange = function () { state.port = parseInt(this.value, 10) || 8080; save(); pingAll(); };
document.getElementById('addrobot').onclick = addRobot;
document.getElementById('subnet').value = guessSubnet();
document.getElementById('port').value = state.port;


// ---------- หุ่น T9 ถึงจุดแล้ว: แสดงปุ่ม OK ในเว็บ ----------
var arrivals = {};        // ip -> ข้อความ (ถ้าหุ่นรอให้กด OK)
var lastSig = '';
function renderAlerts() {
  var ips = Object.keys(arrivals).filter(function (k) { return arrivals[k] !== null; });
  var sig = JSON.stringify(ips.map(function (k) { return [k, arrivals[k]]; }));
  if (sig === lastSig) return;
  var fresh = ips.length && sig.length > lastSig.length;
  lastSig = sig;
  var box = document.getElementById('alerts'); box.innerHTML = '';
  ips.forEach(function (ip) {
    var d = document.createElement('div'); d.className = 'alert';
    var t = document.createElement('span'); t.className = 'txt';
    t.textContent = '🔔 หุ่น ' + nmIp(ip) + ' ถึงแล้ว' + (arrivals[ip] ? ' — ' + arrivals[ip] : '');
    var b = document.createElement('button'); b.textContent = 'OK';
    b.onclick = function () {
      b.disabled = true;
      api(ip, '/ok', 8000)
        .then(function (j) { arrivals[ip] = null; setMsg(ip + ' : ' + j.msg); })
        .catch(function () { b.disabled = false; setMsg('กด OK ที่ ' + ip + ' ไม่ได้'); })
        .then(renderAlerts);
    };
    d.appendChild(t); d.appendChild(b); box.appendChild(d);
  });
  document.title = ips.length ? '🔔 Keenon Hub' : 'Keenon Hub';
  if (fresh) { try { var a = new (window.AudioContext || window.webkitAudioContext)(); var o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(function () { o.stop(); a.close(); }, 250); } catch (e) {} }
}
function pollArrivals() {
  state.robots.forEach(function (r) {
    if (r.mode !== 'diner' && r.mode !== 'industry') return;
    api(r.ip, '/status', 2500)
      .then(function (j) { arrivals[r.ip] = (r.mode === 'diner' && j.state === 'arrived') ? (j.msg || '') : null; if (j.state !== 'ready' && lastDispatch[r.ip] && Date.now() - lastDispatch[r.ip] > 3000) busySeen[r.ip] = Date.now(); robotState[r.ip] = { state: j.state, idle: !!j.idle, seen: j.seen || [] }; if (j.state === 'ready' && j.idle) lastReady[r.ip] = Date.now(); })
      .catch(function () { arrivals[r.ip] = null; robotState[r.ip] = null; })
      .then(function () { renderAlerts(); if (groupMode) renderGroup(); });
  });
}
setInterval(pollArrivals, 2000);

// ---------- เรียกหุ่นที่ว่าง (กลุ่ม T9): ตัวไหนว่างส่งตัวนั้น ----------
function groupRobots(m) { m = m || groupMode || 'diner'; return state.robots.filter(function (r) { return r.mode === m; }); }
function isFree(r) {
  var st = robotState[r.ip];
  if (!st || robotStatus[r.ip] === 'off') return false;
  if (arrivals[r.ip] !== null && arrivals[r.ip] !== undefined) return false;
  if (r.mode === 'industry') {      // S100: หลังรับงานต้องเห็นหุ่นออกจากหน้าเมนูก่อน (กันสั่งซ้ำตอนจอยังค้างหน้าเดิม) ไม่เกิน 10 นาที
    var ld0 = lastDispatch[r.ip] || 0;
    if (ld0 && !((busySeen[r.ip] || 0) > ld0) && Date.now() - ld0 < 600000) return false;
  }
  if (st.state === 'ready') return !!st.idle;
  if (st.state === 'sleep') {            // หน้าจอพัก/หน้าหุ่น: ถือว่าว่างถ้าเรายังไม่ได้สั่งงานตั้งแต่เห็นว่างล่าสุด หรือสั่งไปนานแล้ว
    var ld = lastDispatch[r.ip] || 0;
    return !ld || (lastReady[r.ip] || 0) > ld || Date.now() - ld > 240000;
  }
  return false;
}
function robotLabel(r) {
  if (robotStatus[r.ip] === 'off') return ['ติดต่อไม่ได้', ''];
  if (arrivals[r.ip] !== null && arrivals[r.ip] !== undefined) return ['รอกด OK', 'wait'];
  var st = robotState[r.ip];
  if (!st) return ['ไม่ทราบสถานะ', ''];
  if (isFree(r)) return [st.state === 'sleep' ? 'ว่าง (หน้าจอพัก)' : 'ว่าง', 'free'];
  return ['กำลังทำงาน', ''];
}
function freeRobots(m) {
  var now = Date.now();
  return groupRobots(m).filter(function (r) {
    return isFree(r) && (now - (lastDispatch[r.ip] || 0) > 15000);
  }).sort(function (a, b) { return (lastDispatch[a.ip] || 0) - (lastDispatch[b.ip] || 0); });
}
function gmsg(t) { document.getElementById('gmsg').textContent = t; }
function renderGroup() {
  var rs = groupRobots(), pts = [];
  rs.forEach(function (r) { r.points.forEach(function (p) { if (pts.indexOf(p) < 0) pts.push(p); }); });
  document.getElementById('gtitle').textContent = '👥 เรียกหุ่นที่ว่าง ' + (groupMode === 'industry' ? 'S100' : 'T9') + ' — ระบบเลือกคันที่ว่างให้อัตโนมัติ';
  var gk = '__g' + groupMode;
  var sel = picks[gk] = picks[gk] || [];
  var maxN = 4; rs.forEach(function (r) { maxN = Math.min(maxN, r.max || 4); });
  var g = document.getElementById('gpoints'); g.innerHTML = '';
  if (!pts.length) g.innerHTML = '<span class="empty">ยังไม่มีจุด เลือกหุ่นแต่ละคันแล้วกด "สแกนจุดจากหุ่น" ก่อน</span>';
  pts.forEach(function (p) {
    var b = document.createElement('button'); b.className = 'pt';
    var idx = sel.indexOf(p);
    if (idx >= 0) {
      b.className += ' on';
      var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = idx + 1;
      b.appendChild(bd); b.appendChild(document.createTextNode(p));
    } else b.textContent = p;
    b.onclick = function () {
      var i = sel.indexOf(p);
      if (i >= 0) sel.splice(i, 1); else if (maxN === 1) { sel.length = 0; sel.push(p); } else if (sel.length < maxN) sel.push(p); else gmsg('เลือกได้สูงสุด ' + maxN + ' จุด');
      renderGroup();
    };
    g.appendChild(b);
  });
  var act = document.getElementById('gactions'); act.innerHTML = '';
  var call = document.createElement('button'); call.className = 'start';
  call.textContent = '▶ เรียกหุ่นที่ว่าง ' + sel.length + ' จุด'; call.disabled = !sel.length || !!queue;
  call.onclick = function () { callGroup(sel.slice()); };
  var cl = document.createElement('button'); cl.className = 'small'; cl.textContent = 'ล้างที่เลือก'; cl.disabled = !sel.length;
  cl.onclick = function () { picks[gk] = []; renderGroup(); };
  act.appendChild(call); act.appendChild(cl);
  if (groupMode === 'diner') {
    var rt = document.createElement('button'); rt.className = 'small'; rt.textContent = '↩ ส่งคันที่ว่างกลับจุดพัก (1 คัน)'; rt.disabled = !!queue;
    rt.onclick = function () { callGroup(['กลับจุดพัก'], 'return'); };
    act.appendChild(rt);
  }
  if (queue) {
    var cq = document.createElement('button'); cq.className = 'small'; cq.textContent = 'ยกเลิกคิว (' + queue.list.join(', ') + ')';
    cq.onclick = function () { queue = null; gmsg('ยกเลิกคิวแล้ว'); renderGroup(); };
    act.appendChild(cq);
  }
  var l = document.getElementById('glist'); l.innerHTML = '';
  rs.forEach(function (r) {
    var row = document.createElement('div'); row.className = 'rrow';
    var d = document.createElement('span'); d.className = 'dot ' + (robotStatus[r.ip] || '');
    var lb = robotLabel(r);
    var tg = document.createElement('span'); tg.className = 'tag ' + lb[1]; tg.textContent = lb[0];
    row.appendChild(d); row.appendChild(document.createTextNode(nm(r) + ' ')); row.appendChild(tg);
    var st2 = robotState[r.ip];
    if (st2 && lb[1] !== 'free') { var sn = document.createElement('span'); sn.className = 'seen'; sn.textContent = '[' + st2.state + '] เห็น: ' + (st2.seen || []).slice(0, 8).join(' | '); row.appendChild(sn); }
    l.appendChild(row);
  });
}
function callGroup(list, type) {
  queue = { list: list, tries: 0, mode: groupMode, type: type || 'go' };
  gmsg('กำลังหาหุ่นที่ว่าง ...');
  renderGroup(); tryDispatch();
}
var dispatching = false;
function tryDispatch() {
  if (!queue || dispatching) return;
  var fr = freeRobots(queue.mode);
  if (!fr.length) { gmsg('ทุกคันไม่ว่าง รอคิว: ' + queue.list.join(', ') + ' (จะส่งให้คันแรกที่ว่าง)'); return; }
  var r = fr[0], list = queue.list;
  dispatching = true; queue.tries++; lastDispatch[r.ip] = Date.now();
  gmsg('ส่ง ' + nm(r) + ' ไป ' + list.join(', ') + ' ...'); renderGroup();
  api(r.ip, queue.type === 'return' ? '/return' : '/go?point=' + encodeURIComponent(list.join(',')), 110000)
    .then(function (j) {
      if (/^sent/.test(j.msg)) { gmsg('✔ ' + nm(r) + ' รับงานแล้ว: ' + list.join(', ')); var qm = queue ? queue.mode : groupMode; queue = null; picks['__g' + qm] = []; }
      else if (queue && queue.tries >= 3) { gmsg('ส่งไม่สำเร็จ (' + nm(r) + ' : ' + j.msg + ') ยกเลิกคิว'); queue = null; }
      else gmsg(nm(r) + ' : ' + j.msg + ' → ลองคันอื่น');
    })
    .catch(function () {
      if (queue && queue.tries >= 3) { gmsg('ติดต่อหุ่นไม่ได้ ยกเลิกคิว'); queue = null; } else gmsg('ติดต่อ ' + nm(r) + ' ไม่ได้ → ลองคันอื่น');
    })
    .then(function () { dispatching = false; renderGroup(); });
}
setInterval(tryDispatch, 1500);


render(); pingAll(); setInterval(pingAll, 5000);
setTimeout(discover, 300);   // ค้นหาอัตโนมัติทุกครั้งที่เปิดหน้า
</script>
</body>
