name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 7.5.1 }
      - run: gradle assembleDebug
        working-directory: KeenonRemote
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Keenon Remote (latest)
          files: KeenonRemote/app/build/outputs/apk/debug/app-debug.apk
          
